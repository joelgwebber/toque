[package]
name = "toque"
version = "0.1.0"
edition = "2024"
description = "Drive a ratatui app headlessly from under the hat: inject keys, capture LLM- and test-legible text snapshots, and render frames to SVG."
license = "Apache-2.0"
repository = "https://github.com/joelgwebber/toque"
keywords = ["ratatui", "tui", "testing", "snapshot", "headless"]
categories = ["development-tools::testing", "command-line-interface"]
readme = "README.md"

[dependencies]
ratatui = "0.30"
unicode-width = "0.2"
resvg = { version = "0.48", default-features = false, features = ["text"], optional = true }

[features]
# Rasterize frames to PNG with embedded fonts (see `src/png.rs`). Off by default:
# text and svg snapshots stay dependency-light.
png = ["dep:resvg"]
